name: CI — Maven Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run unit tests
        run: |
          ./mvnw -B -DskipTests=false -Dexclude-integration-tests -Dsurefire.excludes="**/*IntegrationTests" package

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-unit-test-results
          path: target/surefire-reports/**

  static-analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run static analysis (Checkstyle, SpotBugs, PMD)
        run: |
          ./mvnw -B -DskipTests=true checkstyle:check spotbugs:check pmd:check

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/pmd.xml

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        java: [17]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run integration tests
        run: |
          ./mvnw -B -Dtest="**/*IntegrationTests" test

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-integration-test-results
          path: target/surefire-reports/**
